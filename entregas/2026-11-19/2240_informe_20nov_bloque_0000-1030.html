v, 03:30–10:30 Bogotá); cuotas de Betano leídas el 19-nov a las 21:59 y sin releer. Qué pesa y por qué:<\/p>\n<ul>\n<li><b>Goles (los 19 partidos) es el mercado con más cobertura.<\/b> Todos traen entre 23 y 30 líneas de goles más resultado, doble oportunidad y ambos marcan. Es donde hay más líneas con 7 de 10 en ambos equipos, pero también donde la cuota ya cobra lo que ve el filtro: lo que cumple casi siempre paga menos de 1,50.<\/li>\n<li><b>Córners (18 de 19; Bihor–Gloria no los ofrece) pesa en Western Sydney–Adelaide (59 líneas) y Botosani–Voluntari (58).<\/b> En los demás solo hay 8 líneas (Japón y Beijing, 21). En Western Sydney el esperado es 10,3 y cumplen Más 8,0–9,5 (7–8 de 10 en ambos) y Menos 12,5–13,0 (7 y 8 de 10). En Botosani–Voluntari solo cumplen las líneas extremas (Más 4,0–6,5 y Menos 12,5–15,0, cuota 1,03–1,17); en las líneas con cuota útil los equipos andan 4–6 de 10.<\/li>\n<li><b>Remates y tiros al arco de equipo y de jugador: solo Western Sydney–Adelaide y Botosani–Voluntari.<\/b> En Western Sydney el esperado de remates es 26,6 y las líneas Menos 28,5–33,5 cumplen (cuota de 2,22 a 1,28; colchón de 1,9 a 6,9). Las líneas de jugador que cumplen pagan entre 1,09 y 1,36: solo protección. En Botosani únicamente Remus Gutea (tiros al arco Más 1, cuota 1,42, 7 de 8) está en el rango de cuota útil.<\/li>\n<li><b>Tarjetas: solo en esos dos partidos.<\/b> King (Western Sydney) promedia 4,40 tarjetas por partido en sus últimas 20 y supera 3,5 en el 60 % de ellos; el esperado de la ficha es 4,34 y ninguna línea cumple el 7 de 10 en ambos. Flueran (Botosani) promedia 2,50 y supera 3,5 en solo el 30 %, pero la ficha espera 5,25 y Más 3,5 (cuota 1,37) es la única que cumple: el árbitro y los equipos se contradicen, por eso no se recomienda.<\/li>\n<li><b>Los 3 partidos de Japón solo ofrecen goleador<\/b> (no se pidió goleador para esta jornada, así que no se trajo historial de goles por jugador). Sin mercados de jugador de estadística no hacía falta historial.<\/li>\n<li><b>Lo que pesa menos:<\/b> fueras de juego (11 líneas en Botosani, ninguna cumple con Menos 3,5 en ambos) y todo lo que no sea goles/córners en los otros 17 partidos (26–38 líneas de equipo por partido; Beijing y Japón 48–50).<\/li>\n<li><b>Lo que dice la evidencia propia (4–19 nov):<\/b> «Más» ha rendido peor que «Menos»; el filtro 7 de 10 acierta cerca de lo que ya descuenta la cuota; las combinadas de 3 o más patas solo como lotería. Por eso las sugerencias son sobre todo «Menos» y protecciones (cuota &lt; 1,50).<\/li>\n<li><b>Datos que faltan antes de apostar:<\/b> árbitro anunciado en 5 de 19 (Al Sharshani, de Al-Sadd–Lusail, no está en ValueStats); alineaciones solo en 2 partidos (probables, no oficiales); releer cuotas y onces ≈ 1 h antes de cada partido.<\/li>\n<\/ul>","rean":[]}};
