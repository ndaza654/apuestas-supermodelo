do ","tarjetas"]],"ff":"","j":"","no":"Línea con «cumple» (≥ 5 de 7 en ambos).","fu":"registro/lineas.csv"},{"id":"S334","f":"2026-11-13","h":"≈16:00","e":"13-nov (cuotas 12-nov) · informe final: líneas que cumplen","t":"sencilla","n":"tarjetas Menos 5.5","pa":"Serbia–Alemania","k":1,"c":1.18,"p":0.8079,"r":"falló","l":[["tarjetas Menos 5.5",1.18,"F","8 (Flashscore (feed df_st/df_su), leído ","tarjetas"]],"ff":"tarjetas","j":"","no":"Línea con «cumple» (≥ 5 de 7 en ambos).","fu":"registro/lineas.csv"},{"id":"S335","f":"2026-11-13","h":"≈16:00","e":"13-nov (cuotas 12-nov) · informe final: líneas que cumplen","t":"sencilla","n":"tarjetas visitante Más 0.5","pa":"Serbia–Alemania","k":1,"c":1.25,"p":0.7954,"r":"cumplió","l":[["tarjetas visitante Más 0.5",1.25,"C","1 (Flashscore (feed df_st/df_su), leído ","tarjetas"]],"ff":"","j":"","no":"Línea con «cumple» (≥ 5 de 7 en ambos).","fu":"registro/lineas.csv"},{"id":"S336","f":"2026-11-13","h":"≈16:00","e":"13-nov (cuotas 12-nov) · informe final: líneas que cumplen","t":"sencilla","n":"tarjetas visitante Menos 2.5","pa":"Serbia–Alemania","k":1,"c":1.2,"p":0.8,"r":"cumplió","l":[["tarjetas visitante Menos 2.5",1.2,"C","1 (Flashscore (feed df_st/df_su), leído ","tarjetas"]],"ff":"","j":"","no":"Línea con «cumple» (≥ 5 de 7 en ambos).","fu":"registro/lineas.csv"}],"concl":"<h2>Qué aprendimos y qué voy a cambiar en las combinadas</h2>\n<p class=\"mut small\">Base: 336 sugerencias mías del 4 al 13-nov calificadas con resultados reales (equipo: Flashscore; jugador: Sofascore). Son pocas observaciones, muy dependientes entre sí (varias patas del mismo partido y mismo día): sirven como pista, no como ley. Lo que no se pudo calificar está en «Límites» al final.</p>\n\n<h3>1. Lo que dicen los números</h3>\n<ul>\n<li><b>Sencillas: 200 de 283 (71 %) contra una p media dicha de 75 %.</b> Bien calibradas, algo optimistas (4 pts). Las de cuota &lt; 1,50 se dan 78 % pero, a la cuota real, ponerle 1 u a cada una pierde (–13,6 u en 201): con cuota baja el 78 % no alcanza para pagar el 22 % que falla. Las de 1,50–1,99 se dieron solo 53 % (32 de 60): ahí mi p estaba claramente alta.</li>\n<li><b>Combinadas del mismo partido: 9 de 29 (31 %) contra 47 % dicho.</b> Las del informe final del 13-nov dije 59 % de media y salieron <b>3 de 12 (25 %)</b>: estaba muy sobreconfiado. La causa: las armé con patas que parecen independientes pero no lo son («córners Más» + «pocos goles»/«Menos goles») y las traté casi como si multiplicaran bien.</li>\n<li><b>Combinadas entre partidos: 3 de 12 (25 %) contra 19 % dicho</b> (casi todas de cuota alta; aquí la p sí estaba baja y acerté la dirección).</li>\n<li><b>Por nº de patas:</b> 2 patas 7 de 21 (33 %) con p dicha 55 %; 3 patas 5 de 21 (24 %) con p 23 %; 5–6 patas 0 de 3. Las combinadas de 2 patas son donde más me equivoqué: las vendí como «seguras» y eran moneditas.</li>\n<li><b>Bet Builder Serbia–Alemania: 0 de 4.</b> Serbia–Alemania terminó 1-3 con solo 6 córners: fallaron «Goles Menos», «Córners Más» y «Ambos marcan: No» a la vez; las cuatro variantes que di compartían la misma idea (partido cerrado con muchos córners) y cayeron juntas.</li>\n<li><b>En vivo 2.º tiempo: 9 de 12 (75 %)</b> con p dicha 67 %: lo mejor calibrado de todo lo que sugerí (n pequeño).</li>\n<li><b>Lo que tú jugaste de mis variantes: 1 de 3.</b> E1 (Córners Más 6,5 + tiros al arco, cuota 2,0) se dio; C3 (cuota 2,46) y Boss Builder «Mejor» (cuota 5,0) fallaron.</li>\n</ul>\n\n<h3>2. Qué tumbó a las combinadas</h3>\n<ul>\n<li>De 46 combinadas, <b>33 fallaron y 17 de esas fallaron por una sola pata</b>: casi la mitad de los fallos eran «casi ganada». Eso es normal en combinadas, pero indica que una pata de más es el costo.</li>\n<li>Patas que más combinadas tumbaron: <b>goles/resultado 19, córners 15, tarjetas 6, remates/tiros 4</b>. Dentro de combinadas, las patas sueltas se dieron: goles/resultado 52 % (27/52), córners 56 % (19/34), tarjetas 65 % (11/17), remates/tiros 62 % (8/13). Ninguna familia pasa del 65 % cuando va dentro de una combinada: multiplicar 2–3 patas de ~55-60 % da 30-35 %, que es justo lo que salió.</li>\n<li>En las sencillas esas mismas familias se dan mejor (goles/resultado 72 %, remates 71 %, córners 60 % en n = 10): las patas «bonitas» que elegí para combinar eran las más inciertas, no las más seguras.</li>\n<li>Los «córners Más» en partidos de pocos córners (Luxemburgo–Estonia 4, Bulgaria–Islandia 5, Moldavia–Kazajistán 5, Andorra–Gibraltar 5) y los «goles Menos» en partidos abiertos (Países Bajos–Grecia 7-0, Serbia–Alemania 1-3) son los fallos repetidos. Mi patrón de «córners Más + pocos goles» se contradice a sí mismo cuando el partido se abre.</li>\n</ul>\n\n<h3>3. Qué cambio desde ahora en las combinadas</h3>\n<ol>\n<li><b>Máximo 2 patas</b>, y solo si cada una es ≥ 70 % por sí sola. Con 3 o más patas solo como «lotería» de stake mínimo y dicho así.</li>\n<li><b>Prohibido tratar patas del mismo partido como independientes.</b> La p de una combinada del mismo partido la calculo con la simulación conjunta del modelo, no multiplicando; y la recorto un 15–20 % relativo mientras no tenga datos propios que la respalden (con 29 casos reales ya salió 31 % contra 47 % dicho).</li>\n<li><b>No repetir la receta «córners Más + goles Menos»</b> en varios partidos el mismo día: son la misma apuesta («partido cerrado y con mucho córner»), fallan juntas. Máximo una por día.</li>\n<li><b>Cuota mínima útil:</b> las sencillas de cuota &lt; 1,50 se dan bastante pero no pagan; si las sugiero, las marco como «protección» y no como «valor». Las de 1,50–1,99 las voy a presentar con la p recortada (53 % real).</li>\n<li><b>Evitar patas de tarjetas «Más»/jugador dentro de combinadas</b>: dependen del árbitro y de un solo evento.</li>\n<li><b>Mostrar siempre el «real hasta hoy»</b> de cada tipo (sencilla 71 %, combinada 2 patas 33 %, 3 patas 24 %, en vivo 75 %) junto a mi p, para que veas la diferencia en el momento de decidir.</li>\n<li>Cada sugerencia nueva de combinada queda en <code>registro/sugerencias.csv</code> con sus patas en el momento de entregarla (<code>recoleccion/sugerencias.py</code>), para que el próximo balance la califique sin reconstruirla.</li>\n</ol>\n\n<h3>4. Límites y pendientes de esta auditoría</h3>\n<ul>\n<li><b>4–8 nov:</b> solo hay agregados (151 líneas: 72 se dieron, 48 %; boletos recomendados 27 de 51 selecciones; VALOR 5/11, justa 10/14, RIESGO 8/22; en vivo 3/13 boletos). El detalle pata por pata se perdió: si tienes el archivo <i>Balance_lineas_sugeridas_4-8_nov_2026.xlsx</i>, súbelo y lo reconstruyo.</li>\n<li><b>9-nov:</b> los 3 combos de misión salieron 0 de 3 según el balance de ese día, pero no recuperé sus patas; «justo 5/12, evitar 1/7» tampoco está itemizado.</li>\n<li>Estudiantes–Ind. Rivadavia fue a tiempo extra: el feed incluye la prórroga y Betano liquida a 90′; usé tus boletos 65/68 como evidencia y dejé una combinada del 12-noche como «sin verificar».</li>\n<li>Luis Suárez «anota» (Colombia–Chile 1-0): Sofascore no atribuye el gol, queda «sin verificar». Las líneas de 1T sin estadística por tiempo no se calificaron. Inter Bogotá–Santa Fe sigue sin calificar.</li>\n<li>Líneas de jugadores: calificadas solo en 4 partidos del 13-nov (los demás sin datos de jugador en el repo).</li>\n<li>La cuota de las combinadas es el producto de las cuotas sueltas o un precio estimado mío: no es el cupón real de Betano, así que el «1 u en cada una» es un techo.</li>\n<li>La apuesta abierta de Betano sigue sin leerse (sesión de Betano caducada).</li>\n</ul>\n"};

function vRes(){const R=rows(),t=st(R);
 let h=`<div class="card"><h2>Resumen del filtro actual</h2><div class="kpi"><div><span class="mut">Sugerencias</span><b>${R.length}</b></div><div><span class="mut">Se dieron</span><b>${t.c} de ${t.n}</b></div><div><span class="mut">% real</span><b>${pct(t.real)}</b></div><div><span class="mut">p que dije (media)</span><b>${pct(t.p)}</b></div><div><span class="mut">1 u en cada una</span><b class="${t.roi>=0?'pos':'neg'}">${t.nr?t.roi.toFixed(1)+' u':'–'}</b></div></div>
 <p class="small mut">«1 u en cada una» = lo que daría poner 1 unidad en cada sugerencia a su cuota (en combinadas la cuota es el producto de las cuotas sueltas o un precio estimado mío: un techo, no el cupón real). «p que dije» = la probabilidad con la que la presenté. «sin calificar» = parciales (asiáticas), sin verificar o anuladas: no cuentan como ganadas ni perdidas.</p></div>`;
 h+=`<div class="card">${tb(R,tipoG,'Tipo')}${tb(R,s=>s.e,'Entrega')}${tb(R,s=>s.k===1?'1 pata':s.k+' patas','Patas',(a,b)=>parseInt(a)-parseInt(b))}${tb(R,cuotaG,'Cuota',(a,b)=>a.localeCompare(b))}${tb(R,pG,'p que dije',(a,b)=>a.localeCompare(b))}</div>`;
 const lg=legStats(R);h+=`<div class="card"><h3>Patas sueltas dentro de combinadas, por familia</h3><div class="tw"><table><tr><th>Familia</th><th class="n">Patas</th><th class="n">Se dieron</th><th class="n">%</th></tr>${Object.keys(lg).sort((a,b)=>lg[b][1]-lg[a][1]).map(k=>`<tr><td>${esc(k)}</td><td class="n">${lg[k][1]}</td><td class="n">${lg[k][0]}</td><td class="n">${pct(lg[k][0]/lg[k][1])}</td></tr>`).join('')}</table></div>
 <p class="small mut">Una combinada falla si falla cualquier pata; esta tabla mira cada pata por separado (no cuenta las «sin verificar»).</p></div>`;
 const fl=R.filter(s=>s.r==='falló'&&s.k>1);const one=fl.filter(s=>s.l.filter(l=>l[2]==='F'||l[2]==='MP').length===1);
 h+=`<div class="card"><h3>Qué tumbó a las combinadas que fallaron</h3><p>${fl.length} combinadas fallaron; <b>${one.length}</b> por una sola pata (la «pata débil»). Pata que falló, por familia (cuántas combinadas tumbó): ${Object.entries(fl.flatMap(s=>s.ff?s.ff.split(' | '):[]).reduce((a,k)=>(a[k]=(a[k]||0)+1,a),{})).sort((a,b)=>b[1]-a[1]).map(([k,v])=>esc(k)+' '+v).join(' · ')||'–'}.</p></div>`;
 $('#app').innerHTML=h}
function legHtml(l){const c=l[2];return `<div class="leg ${c==='C'||c==='MG'?'c':c==='F'||c==='MP'?'f':''}"><span class="m">${MK[c]||'?'}</span><span>${esc(l[0])}${l[1]?` <span class="mut">@${l[1]}</span>`:''}${l[3]?` <span class="mut small">· ${esc(l[3])}</span>`:''}</span></div>`}
function card(s){const k=RES[s.r]||'o';return `<div class="sc ${k}"><div class="hd"><b>${esc(s.n)}</b><span class="pill ${s.r==='cumplió'?'apto':''}">${esc(s.r)}</span><span class="mut small">${esc(s.pa)}</span></div>
 <div class="small mut">${esc(s.e)}${s.h?' · '+esc(s.h):''} · ${s.k} pata${s.k>1?'s':''}${s.c!=null?' · cuota '+f2(s.c):''}${s.p!=null?' · p '+pct(s.p):''}${s.j?' · <b>'+esc(s.j)+'</b>':''}</div>${s.l.map(legHtml).join('')}${s.no?`<div class="small mut">${esc(s.no)}</div>`:''}</div>`}
const LIM={c:60,s:300};
function vCom(){const R=rows().filter(s=>s.k>1||s.t!=='sencilla').sort((a,b)=>a.f===b.f?(b.c||0)-(a.c||0):b.f.localeCompare(a.f)||0);const n=Math.min(R.length,LIM.c);
 $('#app').innerHTML=`<div class="card"><h2>Combinadas y Bet Builder (${R.length})</h2><p class="small mut">✓ se dio · ✗ falló · ? sin verificar · – anulada. Verde = la combinada entera se dio; rojo = falló.</p>${R.slice(0,n).map(card).join('')}${R.length>n?`<button class="b" id="mas">Ver más (${R.length-n})</button>`:''}</div>`;if($('#mas'))$('#mas').onclick=()=>{LIM.c+=60;vCom()}}
function vSen(){const R=rows().filter(s=>s.k===1&&s.t.includes('sencilla')||s.k===1);const n=Math.min(R.length,LIM.s);
 $('#app').innerHTML=`<div class="card"><h2>Sencillas (${R.length})</h2><div class="tw"><table><tr><th>Día</th><th>Entrega</th><th>Partido</th><th>Línea</th><th class="n">Cuota</th><th class="n">p</th><th>Resultado</th><th>Valor real</th></tr>${R.slice(0,n).map(s=>`<tr><td>${s.f}</td><td>${esc(s.e)}</td><td>${esc(s.pa)}</td><td>${esc(s.n)}</td><td class="n">${f2(s.c)}</td><td class="n">${pct(s.p)}</td><td class="${s.r==='cumplió'?'ok':s.r==='falló'?'bad':''}">${esc(s.r)}</td><td class="mut">${esc((s.l[0]||[])[3]||'')}</td></tr>`).join('')}</table></div>${R.length>n?`<button class="b" id="mas">Ver más (${R.length-n})</button>`:''}</div>`;if($('#mas'))$('#mas').onclick=()=>{LIM.s+=300;vSen()}}
function vCon(){$('#app').innerHTML=`<div class="card concl">${D.concl||'<p class="mut">Sin conclusiones escritas.</p>'}</div>`}
const TABS=[['res','Resumen'],['com','Combinadas'],['sen','Sencillas'],['con','Qué aprendimos y qué cambiar']];
function draw(keep){$('#nav').innerHTML=TABS.map(([k,t])=>`<button data-k="${k}" class="${k===TAB?'on':''}">${t}</button>`).join(' ');$('#nav').onclick=e=>{const k=e.target.dataset.k;if(k){TAB=k;draw(true)}};
 ({res:vRes,com:vCom,sen:vSen,con:vCon})[TAB]();document.querySelector('.card').style.display=(TAB==='con')?'none':''}
flt();draw();
</script></body></html>
