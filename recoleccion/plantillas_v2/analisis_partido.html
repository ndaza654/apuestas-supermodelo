<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Análisis de partido a fondo</title>
<style>
:root{--ink:#1b2430;--mut:#5d6b7a;--line:#d9dee5;--bg:#f6f7f9;--card:#fff;--acc:#0b6b4f;--warn:#9a5b00;--bad:#a4262c;--good:#0b6b4f}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{padding:14px 16px;background:#fff;border-bottom:1px solid var(--line)}h1{font-size:19px;margin:0 0 2px}h2{font-size:16px;margin:18px 0 8px}h3{font-size:14px;margin:12px 0 6px}
.sub{color:var(--mut);font-size:13px}nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer;white-space:nowrap}nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding:12px 14px 60px;max-width:1250px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0}
.note{background:#fff8e6;border:1px solid #ecd9a0;border-radius:6px;padding:8px 10px;font-size:13px;margin:8px 0}.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}.mut{color:var(--mut)}.warn{color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:5px 7px;border-bottom:1px solid #eceff3;text-align:left;vertical-align:top}th{background:#f0f3f7;position:sticky;top:0;cursor:pointer;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:6px;background:#fff}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:8px 0}.filters label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:2px}.filters input,.filters select{font:inherit;padding:5px 6px;border:1px solid var(--line);border-radius:5px;background:#fff}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;border:1px solid var(--line);background:#fff}.pill.g{background:#e6f4ee;border-color:#b5dcc9;color:var(--good)}.pill.r{background:#fbeaea;border-color:#e5b9bb;color:var(--bad)}.pill.y{background:#fff4d9;border-color:#ecd9a0;color:var(--warn)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.big{font-size:22px;font-weight:700}.bar{height:8px;background:#e5e9ee;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
tr.hl td{background:#eef6f2}tr.hl2 td{background:#fdf3e3}small{color:var(--mut)}
</style></head><body>
<header><h1 id="t"></h1><div class="sub" id="st"></div></header>
<nav id="nav"></nav><main id="main"></main>
<script>
/*__DATOS__*/
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f2=x=>x==null||x===''?'–':Number(x).toFixed(2),pc=x=>x==null?'–':(x*100).toFixed(0)+' %',f1=x=>x==null?'–':Number(x).toFixed(1);
const MN={corners:'Córners',goles:'Goles',tarjetas:'Tarjetas (puntos)',al_arco:'Tiros al arco',remates:'Remates',faltas:'Faltas',fueras:'Fueras de juego',saques_banda:'Saques de banda',saques_meta:'Saques de meta',ambos:'Ambos marcan',resultado:'Resultado'};
const JM={remates:'Remates',al_arco:'Tiros al arco',entradas:'Entradas',faltas:'Faltas cometidas',anota:'Anota',anota_o_asiste:'Anota o asiste',asiste:'Asiste',tarjeta:'Tarjeta',atajadas:'Atajadas'};
$('#t').textContent=D.local+' – '+D.visitante;
$('#st').innerHTML=esc(D.liga)+' · '+esc(D.hora||'')+' · cuotas Betano leídas '+esc(D.leido||'')+' · onces: '+esc(D.xi_tipo||'sin publicar')+' (leídos '+esc(D.xi_hora||'?')+' UTC) · todo lo «ajustado por rival» es informativo y <b>sin validar</b>';
const TABS=[['bb','BB Boost'],['ctx','Contexto'],['riv','Rivales'],['eq','Líneas de equipo'],['ju','Jugadores'],['lim','Datos y límites']];
let TAB='bb';const S={boost:25,eq:{q:'',m:'',a:'',ld:'',cmin:1,cmax:100,cf:false,ca:false,sort:'p',dir:-1,lim:250},ju:{q:'',eq:'',m:'',xi:true,cmin:1,cmax:100,sort:'pmz',dir:-1,lim:250,sel:null},bbf:{solo:true,jug:'',sort:'p_stress'},riv:'sot'};
$('#nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('');
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){TAB=b.dataset.t;draw()}};
function draw(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB));$('#main').innerHTML='';({bb:pBB,ctx:pCtx,riv:pRiv,eq:pEq,ju:pJu,lim:pLim})[TAB]()}
// ---------- evidencia de una pata de equipo
const MK={'Remates':'remates','Tiros al arco':'al_arco','Faltas':'faltas','Córners':'corners','Tarjetas':'tarjetas','Saques de meta':'saques_meta','Saques de banda':'saques_banda','Fueras de juego':'fueras','Goles':'goles'};
function evid(n){const m=n.match(/^(.+?)\s*(Everton FC|Brentford FC)?\s*(Más|Menos)\s+([\d.]+)$/);if(!m)return null;const mk=MK[m[1].trim()];if(!mk)return null;const amb=m[2]?(m[2].startsWith(D.visitante.split(' ')[0])?'visitante':'local'):'total';const l=parseFloat(m[4]);return D.equipo.find(x=>x.mercado===mk&&x.ambito===amb&&x.lado===m[3]&&Math.abs(x.linea-l)<1e-6)}
const pago=(pr,b)=>1+(1+b/100)*(pr-1),ev=(p,pr,b)=>p==null?null:p*pago(pr,b)-1,be=(pr,b)=>1/pago(pr,b);
function legRow(n,cu){const x=evid(n);if(!x)return `<tr><td>${esc(n)}</td><td class="n">${f2(cu)}</td><td colspan="6" class="mut">${/Barry/.test(n)?'jugador: ver pestaña Jugadores':'sin ficha de equipo para esta pata (1X2/otro)'}</td></tr>`;
 const c=x.cumple_ficha==='sí',a=x.cumple_aj;return `<tr><td>${esc(n)}</td><td class="n">${f2(cu)}</td><td>${esc(x.reg_local)} · ${esc(x.reg_visitante)}</td><td>${esc(x.aj_local)} · ${esc(x.aj_visitante)}</td><td>${esc(x.directos||'–')}</td><td class="n">${esc(x.esperado)} → ${f1(x.esperado_aj)}</td><td class="n">${pc(+x.p_modelo)}</td><td>${c?'<span class="pill g">crudo ✓</span>':'<span class="pill y">crudo ·</span>'} ${a?'<span class="pill g">ajust. ✓</span>':'<span class="pill y">ajust. ·</span>'}</td></tr>`}
function pBB(){const C=D.combos?D.combos.combos:[],M=$('#main');
 const key=a=>a.slice().sort().join('|'),ER='Remates Everton FC Más 11.5',EF='Faltas Everton FC Menos 10.5',BC='Córners Brentford FC Menos 5.5',BR='Remates Brentford FC Menos 16.5',BB='Thierno Barry Remates 3+ (jugador)';
 const find=l=>C.find(o=>key(o.patas)===key(l));
 const REC=[['BB 1 · núcleo (3 patas)',[ER,EF,BC],'El de más probabilidad entre los que cumplen las condiciones de Betano.'],['BB 2 · núcleo + Brentford remates Menos 16,5 (4 patas)',[ER,EF,BC,BR],'Mismo guion con una pata más: paga más y acierta menos.'],['BB 3 · Everton remates + faltas + Barry + Brentford remates (4 patas)',[ER,EF,BB,BR],'Incluye al jugador Barry. Según los números queda por debajo del equilibrio con Boost +25 %.']];
 M.innerHTML=`<div class="note"><b>Las tres variantes son el MISMO guion</b> (Everton domina los remates, comete pocas faltas y Brentford saca pocos córners): apostar las tres es apostar tres veces lo mismo. Si se juega uno, stake mínimo: son combinadas de ~1 de cada 6 a 1 de cada 9. El precio es el REAL que devuelve Betano al armar la combinación (no el producto). Cada pata debe seguir > 1,50 y el total ≥ 5,05 al releer a las 13:55.</div>
 <div class="filters"><label>% del Boost en el cupón<select id="bo"><option value="25">+25 %</option><option value="50">+50 %</option></select></label><span class="sub">El 21-nov Betano cobró +50 % en un boleto: se lee en el cupón, no se supone.</span></div>
 <div id="recs"></div><h2>Todos los combos con precio real</h2><div class="filters"><label>Mostrar<select id="fs"><option value="1">Solo los que cumplen (patas &gt; 1,50 y total ≥ 5,05)</option><option value="">Todos los precios leídos</option></select></label><label>Jugador<select id="fj"><option value="">Todos</option><option value="n">Solo equipo</option><option value="s">Con jugador</option></select></label></div><div class="tw"><table id="tc"></table></div>`;
 $('#bo').value=S.boost;const rr=()=>{const b=S.boost;$('#recs').innerHTML=REC.map(r=>{const o=find(r[1]);if(!o)return'';const e1=ev(o.p_ajust,o.precio,b),e2=ev(o.p_stress,o.precio,b),q=be(o.precio,b);
  return `<div class="card"><h3>${r[0]}</h3><div class="grid"><div><div class="big">${o.precio.toFixed(2)} <small>precio real Betano · producto de cuotas ${o.producto}</small></div><div>Pago con Boost +${b} %: <b>${pago(o.precio,b).toFixed(2)}</b> por 1 (ganancia × ${(1+b/100).toFixed(2)})</div></div><div>Probabilidad (modelo): <b>${pc(o.p_ajust)}</b> · prudente (stress): <b>${pc(o.p_stress)}</b><br>Equilibrio del Boost: <b>${pc(q)}</b><br>EV: <b class="${e1>0?'ok':'no'}">${e1==null?'–':(e1>=0?'+':'')+(e1*100).toFixed(0)+' %'}</b> con p modelo · <b class="${e2>0?'ok':'no'}">${e2==null?'–':(e2>=0?'+':'')+(e2*100).toFixed(0)+' %'}</b> con p prudente</div></div>
  <div class="tw"><table><tr><th>Pata</th><th class="n">Cuota</th><th>X de 10 crudo (local · visitante)</th><th>Ajustado por rival</th><th>Directos</th><th class="n">Esperado → ajustado</th><th class="n">p modelo</th><th>Cumple</th></tr>${o.patas.map((n,i)=>legRow(n,o.cuotas[i])).join('')}</table></div>${o.nota?`<div class="note">${esc(o.nota)}</div>`:''}<div class="sub">${esc(r[2])}</div></div>`}).join('')};rr();
 $('#bo').onchange=e=>{S.boost=+e.target.value;rr();tc()};
 function tc(){const sol=$('#fs').value,j=$('#fj').value,b=S.boost;let L=C.filter(o=>(!sol||o.cumple_bb)&&(!j||(j==='s')===o.jugador)).slice().sort((a,b2)=>(b2.p_stress||0)-(a.p_stress||0));
  $('#tc').innerHTML=`<tr><th>Patas</th><th class="n">Cuotas</th><th class="n">Producto</th><th class="n">Precio real</th><th class="n">p modelo</th><th class="n">p prudente</th><th class="n">Equilibrio</th><th class="n">EV (p prud.)</th><th>Cumple BB</th></tr>`+L.map(o=>{const e=ev(o.p_stress,o.precio,b);return `<tr><td>${o.patas.map(esc).join(' + ')}</td><td class="n">${o.cuotas.map(f2).join(' · ')}</td><td class="n">${o.producto}</td><td class="n"><b>${o.precio.toFixed(2)}</b></td><td class="n">${pc(o.p_ajust)}</td><td class="n">${pc(o.p_stress)}</td><td class="n">${pc(be(o.precio,b))}</td><td class="n ${e>0?'ok':'no'}">${e==null?'–':(e>=0?'+':'')+(e*100).toFixed(0)+' %'}</td><td>${o.cumple_bb?'<span class="pill g">sí</span>':'<span class="pill r">no</span>'}</td></tr>`}).join('')}
 $('#fs').onchange=tc;$('#fj').onchange=tc;tc()}
// ---------- contexto
function pCtx(){const M=$('#main'),c=D.ctx||[];let h=`<div class="card"><h2>Contexto del partido</h2>${c.map(x=>`<p><b>${esc(x[0])}:</b> ${esc(x[1])}</p>`).join('')}</div>`;
 const u=D.unicos||[],R=u.find(x=>x.mercado==='resultado'),A=u.find(x=>x.mercado==='ambos');
 if(R)h+=`<div class="card"><h3>Lo que dice el precio</h3><p>1X2 Betano: ${esc(D.local)} <b>${R.opciones['1']}</b> · empate <b>${R.opciones.X}</b> · ${esc(D.visitante)} <b>${R.opciones['2']}</b>${A?` · Ambos marcan Sí <b>${A.opciones.si}</b> / No <b>${A.opciones.no}</b>`:''}. Everton es ligeramente favorito (más que Brentford) pese a jugar fuera: es el guion que sostiene Remates Everton Más y Brentford con pocos córners.</p></div>`;
 const al=D.xi,ba=D.bajas;h+=`<div class="card"><h3>Onces (${esc(D.xi_tipo||'sin publicar')}) y bajas</h3><div class="grid"><div><b>${esc(D.local)}</b><br>${(al&&al.L||[]).map(x=>esc(x[0])).join(', ')||'sin once'}<br><span class="warn">Bajas: ${(ba&&ba.L||[]).map(x=>esc(x[0])+' ('+esc(x[2])+')').join(', ')||'ninguna'}</span></div><div><b>${esc(D.visitante)}</b><br>${(al&&al.V||[]).map(x=>esc(x[0])).join(', ')||'sin once'}<br><span class="warn">Bajas: ${(ba&&ba.V||[]).map(x=>esc(x[0])+' ('+esc(x[2])+')').join(', ')||'ninguna reportada'}</span></div></div><div class="note">Los onces oficiales salen ~1 h antes del partido: se releen a las 13:55 y se actualiza todo lo de jugadores.</div></div>`;
 h+=`<div class="card"><h3>Árbitro: ${esc(D.arbitro||'sin anunciar')}</h3><p class="sub">${esc(D.arb_txt||'')}</p></div>`;
 h+=`<div class="card"><h3>Directos recientes (${D.h2h.length})</h3><div class="tw"><table><tr><th>Fecha</th><th>Comp.</th><th>Marcador (local–visit.)</th><th class="n">Córners</th><th class="n">Remates</th><th class="n">Al arco</th><th class="n">Faltas</th></tr>${D.h2h.map(x=>`<tr><td>${x[0]}</td><td>${esc(x[1])}</td><td>${x[2][0]}–${x[2][1]}</td><td class="n">${(x[3].c||[]).join('–')}</td><td class="n">${(x[3].sh||[]).join('–')}</td><td class="n">${(x[3].sot||[]).join('–')}</td><td class="n">${(x[3].f||[]).join('–')}</td></tr>`).join('')}</table></div><div class="sub">Cifras orientadas a (${esc(D.local)} – ${esc(D.visitante)}) de HOY.</div></div>`;
 h+=`<div class="card"><h3>A favor / en contra por mercado (de los datos leídos)</h3>${Object.entries(D.ctx_m||{}).map(([k,v])=>`<p><b>${esc(MN[k]||k)}</b><br>${v.map(f=>`<span class="pill ${f[0]==='+'?'g':f[0]==='-'?'r':''}">${f[0]==='+'?'a favor':f[0]==='-'?'en contra':'neutro'}</span> ${esc(f[1])}`).join('<br>')}</p>`).join('')}<div class="sub">Reglas generales de tipsters y medios, sin resultados verificados.</div></div>`;M.innerHTML=h}
// ---------- rivales
function pRiv(){const M=$('#main');M.innerHTML=`<div class="card"><h2>Qué tan fuerte es cada rival, por mercado</h2><p class="sub">Para cada equipo de la liga: lo que HACE y lo que CONCEDE por partido en sus últimos 10 (feeds de Flashscore, leídos hoy). Con eso se reescala cada partido pasado de ${esc(D.local)} y ${esc(D.visitante)} a «cómo habría salido contra el rival de hoy». Los rivales de otra división (p. ej. Reading, Wolves) se excluyen del ajuste. <b>Sin validar.</b></p><div class="filters"><label>Mercado<select id="rm">${Object.entries(D.rat).map(([k,v])=>`<option value="${k}">${esc(v.nombre)}</option>`).join('')}</select></label></div><div id="rt"></div></div>`;
 $('#rm').value=S.riv;const go=()=>{const k=$('#rm').value;S.riv=k;const r=D.rat[k],mx=Math.max(...r.equipos.map(e=>Math.max(e[1],e[2])));
 const hl=n=>n===D.fl||n===D.fv;$('#rt').innerHTML=`<p>Media de la liga: <b>${r.liga}</b></p><div class="grid"><div class="tw" style="max-height:380px"><table><tr><th>Equipo (concede menos → más)</th><th class="n">Hace</th><th class="n">Concede</th></tr>${r.equipos.map(e=>`<tr class="${hl(e[0])?'hl':''}"><td>${esc(e[0])}</td><td class="n">${e[1]}</td><td class="n">${e[2]}</td></tr>`).join('')}</table></div><div>${['L','V'].map(l=>{const P=D.paj[k]&&D.paj[k][l];if(!P)return'';return `<h3>${esc(l==='L'?D.local:D.visitante)}: cada partido de sus últimos 10</h3><div class="tw" style="max-height:340px"><table><tr><th>Fecha</th><th>Rival</th><th>Sede</th><th class="n">Hizo</th><th class="n">Rival concede</th><th class="n">Ajustado a hoy</th></tr>${P.map(p=>`<tr class="${p[6]?'':'hl2'}"><td>${p[0]}</td><td>${esc(p[1])} <small>${esc(p[2])}</small></td><td>${p[3]}</td><td class="n">${p[4]}</td><td class="n">${p[7]==null?'–':p[7]}</td><td class="n">${p[6]?p[5]:'<span class="mut">excluido</span>'}</td></tr>`).join('')}</table></div>`}).join('')}</div></div>`};$('#rm').onchange=go;go()}
// ---------- tabla genérica
function tabla(id,cols,rows,st,onSort,limKey){const lim=st.lim;const R=rows.slice(0,lim);return `<div class="sub">${rows.length} filas${rows.length>lim?` (mostrando ${lim})`:''}</div><div class="tw"><table><tr>${cols.map(c=>`<th class="${c.n?'n':''}" data-k="${c.k||''}">${c.h}${st.sort===c.k?(st.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr>${R.map(r=>`<tr class="${r._c||''}">${cols.map(c=>`<td class="${c.n?'n':''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</table></div>${rows.length>lim?`<button id="${id}more">Mostrar 250 más</button>`:''}`}
function pEq(){const M=$('#main'),s=S.eq;M.innerHTML=`<div class="card"><h2>Líneas de equipo (${D.equipo.length})</h2><div class="note">Cada fila: lo que ofrece Betano, la probabilidad del precio (sin margen) y del modelo, la regularidad CRUDA de la ficha («X de 10» del local · del visitante), la AJUSTADA por rival («X de n» contra el rival de hoy, n = partidos con rival comparable), el esperado crudo y el ajustado. «Cumple» = ≥ 7 de 10 (ajustado: ≥ 70 % con n ≥ 6) en los dos equipos. El colchón y el ajuste son informativos: ninguna línea se oculta.</div>
 <div class="filters"><label>Buscar<input id="q" value="${esc(s.q)}"></label><label>Mercado<select id="m"><option value="">Todos</option>${Object.entries(MN).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>Ámbito<select id="a"><option value="">Todos</option><option>local</option><option>visitante</option><option>total</option><option>1T</option><option>2T</option></select></label><label>Lado<select id="ld"><option value="">Ambos</option><option>Más</option><option>Menos</option></select></label><label>Cuota mín.<input id="cmin" size="4" value="${s.cmin}"></label><label>Cuota máx.<input id="cmax" size="4" value="${s.cmax}"></label><label><input type="checkbox" id="cf"> cumple crudo</label><label><input type="checkbox" id="ca"> cumple ajustado</label></div><div id="te"></div></div>`;
 ['m','a','ld'].forEach(k=>$('#'+k).value=s[k]);$('#cf').checked=s.cf;$('#ca').checked=s.ca;
 const cols=[{h:'Mercado',k:'mercado',f:r=>esc(MN[r.mercado]||r.mercado)},{h:'Ámbito',k:'ambito',f:r=>esc(r.ambito)},{h:'Línea',k:'linea',n:1,f:r=>r.linea},{h:'Lado',k:'lado',f:r=>esc(r.lado)},{h:'Cuota',k:'cuota',n:1,f:r=>f2(r.cuota)},{h:'p precio',k:'pm',n:1,f:r=>pc(+r.p_mercado)},{h:'p modelo',k:'p',n:1,f:r=>pc(+r.p_modelo)},{h:'Crudo L · V',k:'cl',f:r=>esc(r.reg_local)+' · '+esc(r.reg_visitante)},{h:'Ajustado L · V',k:'al',f:r=>esc(r.aj_local)+' · '+esc(r.aj_visitante)},{h:'Directos',f:r=>esc(r.directos||'–')},{h:'Esperado → ajust.',n:1,f:r=>esc(r.esperado||'–')+' → '+f1(r.esperado_aj)},{h:'Colchón',n:1,f:r=>esc(r.colchon||'–')},{h:'Cumple',f:r=>(r.cumple_ficha==='sí'?'<span class="pill g">crudo</span> ':'')+(r.cumple_aj?'<span class="pill g">ajust.</span>':'')}];
 const val={p:r=>+r.p_modelo,pm:r=>+r.p_mercado,cuota:r=>r.cuota,linea:r=>r.linea,mercado:r=>r.mercado,ambito:r=>r.ambito,lado:r=>r.lado,cl:r=>parseInt(r.reg_local)||0,al:r=>parseInt(r.aj_local)||0};
 const go=()=>{let L=D.equipo.filter(r=>(!s.m||r.mercado===s.m)&&(!s.a||r.ambito===s.a)&&(!s.ld||r.lado===s.ld)&&r.cuota>=s.cmin&&r.cuota<=s.cmax&&(!s.q||(r.mercado+' '+r.ambito+' '+r.linea+' '+r.lado).toLowerCase().includes(s.q.toLowerCase()))&&(!s.cf||r.cumple_ficha==='sí')&&(!s.ca||r.cumple_aj));
  const g=val[s.sort]||val.p;L.sort((a,b)=>{const x=g(a),y=g(b);return (x>y?1:x<y?-1:0)*s.dir});$('#te').innerHTML=tabla('te',cols,L,s);
  $('#te').querySelectorAll('th').forEach((th,i)=>th.onclick=()=>{const k=cols[i].k;if(!k)return;if(s.sort===k)s.dir*=-1;else{s.sort=k;s.dir=-1}go()});const mb=$('#temore');if(mb)mb.onclick=()=>{s.lim+=250;go()}};
 const bind=(id,k,t)=>$('#'+id).oninput=$('#'+id).onchange=e=>{s[k]=t==='b'?e.target.checked:t==='n'?(parseFloat(e.target.value)||0):e.target.value;s.lim=250;go()};bind('q','q');bind('m','m');bind('a','a');bind('ld','ld');bind('cmin','cmin','n');bind('cmax','cmax','n');bind('cf','cf','b');bind('ca','ca','b');go()}
function pJu(){const M=$('#main'),s=S.ju;M.innerHTML=`<div class="card"><h2>Jugadores</h2><div class="note">«N+» = N o más (la línea de Betano). «X de n» = en cuántos de sus últimos partidos con ≥ 30 min llegó a la línea; «ajustado» (solo remates y tiros al arco) reescala cada partido al rival de hoy. «p mezcla» encoge esa muestra hacia la probabilidad del precio (peso 6): <b>heurística propia sin validar</b>; el modelo de jugador venía inflado 17–19 puntos en los balances. Los onces son <b>probables</b> (se releen a las 13:55).</div>
 <div class="filters"><label>Buscar<input id="q" value="${esc(s.q)}"></label><label>Equipo<select id="eq"><option value="">Ambos</option><option value="L">${esc(D.local)}</option><option value="V">${esc(D.visitante)}</option></select></label><label>Estadística<select id="m"><option value="">Todas</option>${Object.entries(JM).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>Cuota mín.<input id="cmin" size="4" value="${s.cmin}"></label><label>Cuota máx.<input id="cmax" size="4" value="${s.cmax}"></label><label><input type="checkbox" id="xi"> solo XI probable</label></div><div id="tj"></div><div id="pc"></div></div>`;
 $('#eq').value=s.eq;$('#m').value=s.m;$('#xi').checked=s.xi;const cols=[{h:'Jugador',k:'j',f:r=>`<a href="#" data-j="${esc(r.j)}">${esc(r.j)}</a>`},{h:'Eq.',k:'eq',f:r=>r.eq},{h:'XI',k:'tit',f:r=>r.tit==='0.9'?'<span class="pill g">XI</span>':r.tit==='0.0'||r.tit===0?'<span class="pill r">baja</span>':'<span class="pill">banca</span>'},{h:'Estad.',k:'m',f:r=>esc(JM[r.m]||r.m)},{h:'Línea',k:'l',n:1,f:r=>(r.ld==='Sí'?'Sí':r.l+'+')},{h:'Cuota',k:'c',n:1,f:r=>f2(r.c)},{h:'p precio',k:'pm',n:1,f:r=>pc(r.pm)},{h:'Crudo',k:'x',f:r=>r.n?r.x+' de '+r.n:'–'},{h:'p mezcla',k:'pmz',n:1,f:r=>pc(r.pmz)},{h:'Ajustado',f:r=>r.an?r.ax+' de '+r.an:'–'},{h:'p mezcla ajust.',k:'pmza',n:1,f:r=>pc(r.pmza)},{h:'Media (cruda → ajust.)',n:1,f:r=>r.media==null?'–':f2(r.media)+' → '+f2(r.media_aj)},{h:'Cumple',f:r=>r.cum==='sí'?'<span class="pill g">sí</span>':''}];
 const go=()=>{let L=D.jug.filter(r=>(!s.eq||r.eq===s.eq)&&(!s.m||r.m===s.m)&&r.c>=s.cmin&&r.c<=s.cmax&&(!s.xi||r.tit==='0.9')&&(!s.q||(r.j+' '+r.m).toLowerCase().includes(s.q.toLowerCase())));
  L.sort((a,b)=>{const x=a[s.sort]==null?-1:a[s.sort],y=b[s.sort]==null?-1:b[s.sort];return (x>y?1:x<y?-1:0)*s.dir});$('#tj').innerHTML=tabla('tj',cols,L,s);
  $('#tj').querySelectorAll('th').forEach((th,i)=>th.onclick=()=>{const k=cols[i].k;if(!k)return;if(s.sort===k)s.dir*=-1;else{s.sort=k;s.dir=-1}go()});$('#tj').querySelectorAll('a[data-j]').forEach(a=>a.onclick=e=>{e.preventDefault();s.sel=a.dataset.j;card()});const mb=$('#tjmore');if(mb)mb.onclick=()=>{s.lim+=250;go()}};
 const card=()=>{const c=D.cards.find(x=>x.j===s.sel);if(!c){$('#pc').innerHTML='';return}const P=c.p,tot=k=>P.reduce((a,p)=>a+(p[k]||0),0),n=P.filter(p=>(p[1]||0)>0).length;
  $('#pc').innerHTML=`<h3>${esc(c.j)} · ${esc(c.pos||'')} · ${c.eq==='L'?esc(D.local):esc(D.visitante)}${c.fuera?' · <span class="no">BAJA</span>':''}</h3><div class="tw" style="max-height:300px"><table><tr><th>Fecha</th><th class="n">Min</th><th class="n">Remates</th><th class="n">Al arco</th><th class="n">Goles</th><th class="n">Asist.</th><th class="n">Tarjeta</th><th class="n">Faltas</th><th class="n">Entradas</th><th class="n">Atajadas</th></tr>${P.map(p=>`<tr>${p.map((v,i)=>`<td class="${i?'n':''}">${v==null?'–':v}</td>`).join('')}</tr>`).join('')}<tr><th>Total (${n} partidos)</th><th class="n">${tot(1)}</th><th class="n">${tot(2)}</th><th class="n">${tot(3)}</th><th class="n">${tot(4)}</th><th class="n">${tot(5)}</th><th class="n">${tot(6)}</th><th class="n">${tot(7)}</th><th class="n">${tot(8)}</th><th class="n">${tot(9)}</th></tr></table></div><div class="sub">Flashscore: sin «faltas recibidas»; «entradas» = entradas totales de la tabla (Betano cuenta las suyas).</div>`;$('#pc').scrollIntoView({behavior:'smooth'})};
 const bind=(id,k,t)=>$('#'+id).oninput=$('#'+id).onchange=e=>{s[k]=t==='b'?e.target.checked:t==='n'?(parseFloat(e.target.value)||0):e.target.value;s.lim=250;go()};bind('q','q');bind('eq','eq');bind('m','m');bind('cmin','cmin','n');bind('cmax','cmax','n');bind('xi','xi','b');go();card()}
function pLim(){$('#main').innerHTML=`<div class="card"><h2>Datos y límites</h2><ul><li>Cuotas: Betano, 597 mercados (lectura completa a las 11:52 Bogotá, comparada con la de las 09:28: 112 cuotas se movieron). Precios de combos: <code>/api/betslip/v3/mc-leg</code> (solo lectura; no coloca nada), 12:05.</li><li>Historial de equipo y jugadores: Flashscore, últimos 10 partidos oficiales de cada equipo (Reading y Wolves son de otra división: sus partidos salen sin ajuste).</li><li>Ratings de rival: últimos 10 de cada rival (18 equipos), leídos por feeds hoy. El ajuste (multiplicativo, tope ×0,5–×2, partido propio excluido del rating del rival) es una propuesta <b>sin validar</b>; el backtest está pendiente.</li><li>Onces: <b>probables</b> (Flashscore 10:37 Bogotá). Brentford tiene 7 bajas. Si un titular no sale en el once oficial, su línea de jugador no vale.</li><li>Las probabilidades de combos con varias patas salen de la simulación del modelo (con dependencia medida); en un combo con jugador se multiplica por una estimación propia. El modelo de jugador venía inflado 17–19 puntos.</li><li>El Boost (+25 % o +50 %) se confirma en el cupón. 3–4 patas = lotería: stake mínimo. Las tres variantes son el mismo guion.</li><li>Faltan: faltas recibidas por jugador (Flashscore no las trae), estadísticas por tiempo, y cualquier lectura de motivación o bajas defensivas más allá de lo publicado por Flashscore.</li></ul></div>`}
